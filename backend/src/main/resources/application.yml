server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: apexpathway-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:apexpathway}
    username: ${POSTGRES_USER:apex}
    password: ${POSTGRES_PASSWORD:apex_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

apexpathway:
  duckdb:
    path: ${DUCKDB_PATH:data/historical/bhavcopy.duckdb}
  safety:
    max-single-order-value: ${MAX_SINGLE_ORDER_VALUE:50000.00}
    max-daily-trades: ${MAX_DAILY_TRADES:5}
    static-ip-whitelist: ${STATIC_IP_WHITELIST:127.0.0.1}
